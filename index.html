<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Link | Loading...</title>
    
    <script>
        // 1. Detect the user's browser or device language
        const userLanguage = navigator.language || navigator.userLanguage;
        
        // 2. Clear old strings to get the main two-letter language code (e.g., 'ar-EG' -> 'ar')
        const cleanLang = userLanguage.toLowerCase().slice(0, 2);

        // 3. Asynchronous redirection logic based on language rules
        if (cleanLang === 'ar') {
            // If the language is Arabic, redirect to the Arabic directory
            window.location.href = "ar/index.html";
        } else {
            // Default fallback: Redirect all other world languages to the English directory
            window.location.href = "en/index.html";
        }
    </script>
</head>
<body style="background-color: #021a3f; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; color: white;">

    <div style="text-align: center; padding: 20px;">
        <h2 style="margin-bottom: 10px;">Welcome to Prime Link</h2>
        <p style="opacity: 0.8; font-size: 0.9rem; margin-bottom: 20px;">Please select your preferred language / الرجاء اختيار اللغة المفضلة</p>
        <div style="display: flex; gap: 15px; justify-content: center;">
            <a href="en/index.html" style="color: #ffffff; background-color: #032b69; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: 600; font-size: 0.85rem;">English</a>
            <a href="ar/index.html" style="color: #ffffff; background-color: #198754; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: 600; font-size: 0.85rem;">العربية</a>
        </div>
    </div>

</body>
</html>
